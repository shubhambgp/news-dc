# Static Vite build behind Caddy (which adds TLS, compression and security headers).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed file names: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths render index.html, which must always be revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
