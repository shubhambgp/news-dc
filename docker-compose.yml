# Local development stack. Production lives in docker-compose.prod.yml (Phase 10).
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the compose network the DB host is "db" on its internal port, whatever .env says.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-newsdc}:${POSTGRES_PASSWORD:-newsdc}@db:5432/${POSTGRES_DB:-newsdc}
    FASTEMBED_CACHE_PATH: /models  # embedding model survives restarts (worker embeds items, API embeds search queries)
  volumes:
    - ./backend:/app
    - ./config:/config:ro  # categories.yaml / sources.yaml (app.config.config_dir resolves to /config)
    - models:/models
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsdc}
      POSTGRES_DB: ${POSTGRES_DB:-newsdc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    # Migrate first; the app seeds categories/sources on startup.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    init: true  # forward SIGTERM so `docker compose down` stops it promptly
    stop_grace_period: 60s  # let the running job reach a safe point and release itself

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # The browser calls the API directly on the host port in dev.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  models:
