name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: newsdc
          POSTGRES_PASSWORD: newsdc
          POSTGRES_DB: newsdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsdc -d newsdc_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway DB for the integration tests in tests/test_db.py (its schema is dropped).
      TEST_DATABASE_URL: postgresql+psycopg://newsdc:newsdc@localhost:5432/newsdc_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q
      # Known vulnerabilities in the locked runtime dependencies (Phase 10, SECURITY.md).
      - run: uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
      - run: uvx pip-audit@2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint --deny-warnings
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Playwright smoke test (Phase 9). The API is mocked inside the test.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"

  images:
    # The production images build (Phase 10). Pushing them anywhere is out of scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t newsdc-backend backend
      - run: docker build -t newsdc-frontend frontend
