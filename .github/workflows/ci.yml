name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: newsdc
          POSTGRES_PASSWORD: newsdc
          POSTGRES_DB: newsdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsdc -d newsdc_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway DB for the integration tests in tests/test_db.py (its schema is dropped).
      TEST_DATABASE_URL: postgresql+psycopg://newsdc:newsdc@localhost:5432/newsdc_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q
      # Known vulnerabilities in the locked runtime dependencies (Phase 10, SECURITY.md).
      - run: uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
      - run: uvx pip-audit@2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint --deny-warnings
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Playwright smoke test (Phase 9). The API is mocked inside the test.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"

  images:
    # The production images build (Phase 10). Pushing them anywhere is out of scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t newsdc-backend backend
      - run: docker build -t newsdc-frontend frontend

  deploy:
    # Push to main with every check green → the VPS pulls main and rebuilds (scripts/deploy.sh).
    needs: [backend, frontend, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }
    environment: { name: production, url: "https://news-dc.atinus.co" }
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's authorized_keys forces scripts/deploy.sh for this key.
          ssh -o BatchMode=yes "$DEPLOY_TARGET"
      - name: Smoke test
        run: |
          base=https://news-dc.atinus.co
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$base/api/v1/ready"
          curl -fsS "$base/" | grep -q '<div id="root">'
          curl -fsS "$base/api/v1/items?page_size=1" > /dev/null
