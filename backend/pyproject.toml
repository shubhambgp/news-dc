[project]
name = "newsdc-backend"
version = "0.1.0"
description = "NewsDC backend: API, ingestion and AI pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
